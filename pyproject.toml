[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-finance-platform"
version = "0.0.0"
description = "Validation-first quantitative-finance research and model-validation platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0",
    "ruff>=0.9",
    "scipy-stubs>=1.18.1.0",
]
desktop = [
    "PySide6==6.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/qf_platform/desktop", "tests/desktop"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
