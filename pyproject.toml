[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-finance-platform"
version = "0.1.0"
description = "Validation-first quantitative-finance research and model-validation platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0",
    "ruff>=0.9",
    "scipy-stubs>=1.18.1.0",
    "openpyxl>=3.1,<4",
    "dash>=3.2,<4",
    "plotly>=6.1,<7",
]
desktop = [
    "PySide6==6.11.2",
]
research = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.9,<4",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
]
reporting = [
    "openpyxl>=3.1,<4",
]
web = [
    "dash>=3.2,<4",
    "plotly>=6.1,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests", "examples/research", "examples/reporting"]
exclude = ["src/qf_platform/desktop", "tests/desktop"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
