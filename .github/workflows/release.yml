name: Release Verification

on:
  pull_request:
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/release/**"
      - "docs/evidence/m7_spx_bs_vs_heston_validation_reference.json"
      - "docs/evidence/m8_performance_reference.json"
      - "scripts/v01_release_check.py"
      - "tests/test_v01_release_check.py"
      - "src/qf_platform/desktop/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/release/**"
      - "docs/evidence/m7_spx_bs_vs_heston_validation_reference.json"
      - "docs/evidence/m8_performance_reference.json"
      - "scripts/v01_release_check.py"
      - "tests/test_v01_release_check.py"
      - "src/qf_platform/desktop/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install headless Qt runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Install v0.1 release dependencies non-editably
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]"

      - name: Verify installed distribution version
        run: |
          python -c "from importlib.metadata import version; assert version('quant-finance-platform') == '0.1.0'"

      - name: Verify committed release evidence
        run: python scripts/v01_release_check.py

      - name: Installed Workbench source smoke
        run: python -m qf_platform.desktop.main --smoke-test
