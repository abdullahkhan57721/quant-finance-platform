name: Generate reporting output

on:
  push:
    branches:
      - chore/reporting-output

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reporting dependencies
        run: python -m pip install -e ".[reporting]"
      - name: Generate validation report
        run: python examples/reporting/export_reference_validation.py --output reporting_output
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reporting_output
          git commit -m "chore: generate validation reporting output"
          git push
