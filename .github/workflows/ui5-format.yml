name: UI5 temporary formatter

on:
  push:
    branches:
      - ui5/43-validation-model-risk-hardening
    paths:
      - .github/workflows/ui5-format.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui5/43-validation-model-risk-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e ".[dev]"
          ./scripts/fix
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "UI5: apply canonical Python formatting"
          git push origin HEAD:ui5/43-validation-model-risk-hardening
