name: UI3 Format Repair

on:
  push:
    branches:
      - ui3/32-hedging-market-inverse-workbench

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui3/32-hedging-market-inverse-workbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply repository formatter and autofixes
        run: ./scripts/fix
      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "UI3: apply repository autofixes"
          git push origin HEAD:ui3/32-hedging-market-inverse-workbench
