name: UI3 QML Role Repair

on:
  push:
    branches:
      - ui3/32-hedging-market-inverse-workbench

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui3/32-hedging-market-inverse-workbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair market observation Qt role name
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path("src/qf_platform/desktop/models.py")
          text = models.read_text()
          old = '_MARKET_RIGHT_ROLE: QByteArray(b"right"),'
          new = '_MARKET_RIGHT_ROLE: QByteArray(b"optionRight"),'
          if old not in text:
              raise SystemExit("Expected market role declaration not found")
          models.write_text(text.replace(old, new, 1))

          qml = Path("src/qf_platform/desktop/qml/MarketWorkspace.qml")
          text = qml.read_text()
          old = 'required property string right'
          if old not in text:
              raise SystemExit("Expected QML role property not found")
          text = text.replace(old, 'required property string optionRight', 1)
          text = text.replace('parent.parent.right + " K="', 'parent.parent.optionRight + " K="', 1)
          qml.write_text(text)
          PY
      - name: Install development tools and apply repository autofixes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ./scripts/fix
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qf_platform/desktop/models.py src/qf_platform/desktop/qml/MarketWorkspace.qml
          git commit -m "UI3: avoid final QML role collision"
          git push origin HEAD:ui3/32-hedging-market-inverse-workbench
