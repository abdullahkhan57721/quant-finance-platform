name: UI3 Docs Finalize

on:
  push:
    branches:
      - ui3/32-hedging-market-inverse-workbench

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui3/32-hedging-market-inverse-workbench
      - name: Update durable UI3 repository truth
        run: |
          python - <<'PY'
          from pathlib import Path

          architecture = Path("docs/architecture/native_quant_workbench.md")
          text = architecture.read_text()
          text = text.replace(
              "UI1 established the native PySide6 + Qt Quick/QML desktop architecture over the M1 Black-Scholes analytical vertical. UI2 extends that same architecture over the actual merged M2 valuation and sensitivity capabilities.",
              "UI1 established the native PySide6 + Qt Quick/QML desktop architecture over the M1 Black-Scholes analytical vertical. UI2 extends that same architecture over the actual merged M2 valuation and sensitivity capabilities. UI3 extends the same boundary over the merged M3 dynamic-control and M4 observed-market/inverse-problem capabilities while preserving them as different mathematical workflows.",
          )
          marker = "## Packaging and validation\n"
          if marker not in text:
              raise SystemExit("native Workbench packaging marker not found")
          ui3 = '''## UI3 — dynamic hedging and observed-market inference\n\nUI3 adds a workflow home that asks the mathematical question before choosing a screen:\n\n```text\nValuation & Sensitivity\nDynamic Hedging / Control\nMarket Evidence / Implied Volatility\n```\n\nThe existing UI2 valuation workspace remains intact. The two new workspaces are concrete downstream adapters over M3 and M4 rather than a universal workflow schema.\n\n### Dynamic hedging\n\nThe application layer constructs an immutable hedge request from the existing Black-Scholes financial composition plus explicit generating volatility, hedge-assumed volatility, rebalance cadence, seed, replicate count, and proportional transaction-cost rate. It preserves M3's zero-continuous-dividend execution boundary.\n\nOne selected trajectory remains distinct from replicate evidence. Rebalance-frequency, volatility-misspecification, and transaction-cost comparisons reuse the same generated seeded paths across conditions, so displayed differences are controlled comparisons rather than unrelated Monte Carlo draws. QML receives only prepared path rows, aggregate rows, inspector values, and renderer-neutral plots; it never recomputes Delta, financing, trades, costs, payoff, or replication error.\n\nThe hedging mathematical inspector remains concrete:\n\n```text\nState\nGenerating law\nSensitivity source\nControl policy\nRebalance schedule\nFinancing / transaction-cost convention\nReplication objective / error\n```\n\n### Market evidence and implied volatility\n\nThe market workspace keeps the M4 lifecycle visible:\n\n```text\nraw observation + provenance\n        ↓\nexplicit normalization\n        ↓\nnormalized observed target\n        ↓\nBlack-Scholes implied-volatility problem\n        +\nbracketed bisection method\n        ↓\nimmutable inverse result + conditioning evidence\n```\n\nSynthetic deterministic M4 observations support the runnable raw-to-normalized-to-inferred laboratory. Invalid normalization remains explicit. Financial inconsistency, failure to bracket the admissible volatility domain, numerical convergence evidence, and poor inverse conditioning remain different concepts. Vega, local inverse price-to-volatility sensitivity, and first-order half-spread volatility shift come from authoritative M4 results.\n\nThe historical SPX panel is deliberately **derived empirical evidence only**. UI3 renders the pinned M4 strike/maturity implied-volatility and conditioning evidence plus source/non-redistribution provenance; it does not fabricate or redistribute upstream raw SPX rows that M4 intentionally did not retain. Static monotonicity/convexity findings remain diagnostics, not surface repair.\n\nThe inverse-problem mathematical inspector is likewise concrete:\n\n```text\nObserved target\nForward model\nUnknown parameter\nAdmissible domain\nInverse method\nConditioning evidence\n```\n\n### UI3 execution and presentation boundary\n\nUI3 reuses the narrow QThread ownership pattern for one immutable M3 hedge request and one bundled M4 evidence request. It does not add cancellation, queues, progress protocols, a scheduler, or a generic job registry.\n\nThe existing `PlotData -> PlotSeries -> PlotPoint` value seam is sufficient for hedge time series, replicate/frequency evidence, discrete implied-volatility slices, and conditioning plots. Synchronized row selection remains a concrete controller/presentation responsibility. No universal visualization grammar is introduced.\n\nM5 Heston pricing is merged but intentionally not surfaced by UI3. The next desktop milestone must consume actual merged M5/M6 contracts rather than retrofitting Heston or calibration semantics into UI3.\n\n'''
          architecture.write_text(text.replace(marker, ui3 + marker, 1))

          current = Path("docs/development/current_state.md")
          text = current.read_text()
          ui2 = "**UI2 — M2 Valuation Comparison, Convergence, Uncertainty & Greeks Workbench is complete.** UI2 extends the existing Black-Scholes Study over the actual merged M2 pricing and sensitivity contracts without adding UI-owned finance semantics or a generic desktop framework.\n"
          if ui2 not in text:
              raise SystemExit("current-state UI2 marker not found")
          text = text.replace(
              ui2,
              ui2 + "\n**UI3 — Dynamic Hedging, Market Evidence & Inverse-Problem Workbench is complete.** UI3 adds separate native M3 control and M4 observed-market/inference workflows, a three-question workflow home, paired hedge-comparison evidence, raw/normalized/inferred observation inspection, provenance, conditioning, discrete smile/skew evidence, and route-specific mathematical inspectors without adding UI-owned finance semantics or a generic workflow framework.\n",
              1,
          )
          old = "The next finance-model milestone is **M6 — Heston Calibration / Inverse Problem**. It should consume the validated M5 Heston forward-pricing capability and M4 observation/inference discipline while keeping calibration targets/objectives separate from numerical optimization. The next desktop milestone should still be chosen from actual merged M3/M4/M5 product pressure rather than pre-building generic hedge, market-data, stochastic-volatility, or calibration UI frameworks."
          new = "The next finance-model milestone is **M6 — Heston Calibration / Inverse Problem**. It should consume the validated M5 Heston forward-pricing capability and M4 observation/inference discipline while keeping calibration targets/objectives separate from numerical optimization. The next desktop milestone is **UI4**, scoped from the actual merged M5/M6 contracts: M5 forward Heston valuation can be surfaced now, while any calibration UI must wait for merged M6 rather than speculate about its API."
          if old not in text:
              raise SystemExit("current-state next-milestone marker not found")
          text = text.replace(old, new, 1)
          current.write_text(text)

          roadmap = Path("docs/development/roadmap.md")
          text = roadmap.read_text()
          marker = "## M6 — Heston calibration / inverse problem\n"
          if marker not in text:
              raise SystemExit("roadmap M6 marker not found")
          ui3_roadmap = '''## UI3 — Dynamic hedging, market evidence, and inverse-problem Workbench\n\n**Status: complete.**\n\nUI3 consumes merged M3/M4 contracts downstream of the quantitative core. The native home now exposes three mathematically distinct questions—valuation/sensitivity, dynamic hedging/control, and market evidence/implied volatility—without introducing a universal workflow schema. The M3 workspace preserves selected-path versus replicate evidence and paired-condition comparisons; the M4 workspace preserves raw versus normalized versus inferred quantities, provenance, solver evidence versus conditioning, discrete smile/skew evidence, and non-redistributed derived SPX evidence.\n\nUI3 intentionally does not expose the merged M5 Heston model. UI4 should begin from actual merged M5 forward-pricing contracts and may include calibration only after M6 itself is merged and validated.\n\n---\n\n'''
          roadmap.write_text(text.replace(marker, ui3_roadmap + marker, 1))
          PY
      - name: Commit durable documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/native_quant_workbench.md docs/development/current_state.md docs/development/roadmap.md
          git commit -m "docs(UI3): record control and inverse Workbench architecture"
          git push origin HEAD:ui3/32-hedging-market-inverse-workbench
