name: UI5 lifecycle fix

on:
  push:
    branches:
      - ui5/43-validation-model-risk-hardening
    paths:
      - .github/workflows/ui5-lifecycle-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui5/43-validation-model-risk-hardening
          fetch-depth: 0
      - name: Patch Qt worker lifetime handling
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "src/qf_platform/desktop/ui2_controller.py": [
                  (
                      "        self._thread: QThread | None = None\n        self._worker: QObject | None = None\n",
                      "        self._thread: QThread | None = None\n        self._worker: QObject | None = None\n        self._running = False\n",
                  ),
                  (
                      "    def running(self) -> bool:\n        return self._thread is not None\n",
                      "    def running(self) -> bool:\n        return self._running\n",
                  ),
                  (
                      "    def _worker_finished(self) -> None:\n        self._worker = None\n        self._thread = None\n        self.runningChanged.emit()\n",
                      "    def _worker_finished(self) -> None:\n        # Keep the just-finished PySide wrappers alive outside QThread.finished.\n        # Releasing them in this callback can race Qt deferred QObject destruction.\n        self._running = False\n        self.runningChanged.emit()\n",
                  ),
                  (
                      "        self._worker = worker\n        self._thread = thread\n        self.runningChanged.emit()\n        thread.start()\n",
                      "        self._worker = worker\n        self._thread = thread\n        self._running = True\n        self.runningChanged.emit()\n        thread.start()\n",
                  ),
              ],
              "src/qf_platform/desktop/ui3_controller.py": [
                  (
                      "        self._worker = worker\n        self._thread = thread\n        self.runningChanged.emit()\n        thread.start()\n",
                      "        self._worker = worker\n        self._thread = thread\n        self._running = True\n        self.runningChanged.emit()\n        thread.start()\n",
                  ),
              ],
              "src/qf_platform/desktop/ui4_controller.py": [
                  (
                      "    def _ui4_worker_finished(self) -> None:\n        self._worker = None\n        self._thread = None\n        self._ui4_active_job_id = None\n",
                      "    def _ui4_worker_finished(self) -> None:\n        # Keep the just-finished PySide wrappers alive outside QThread.finished.\n        # Releasing them in this callback can race Qt deferred QObject destruction.\n        self._running = False\n        self._ui4_active_job_id = None\n",
                  ),
                  (
                      "        self._worker = worker\n        self._thread = thread\n        self.runningChanged.emit()\n        thread.start()\n",
                      "        self._worker = worker\n        self._thread = thread\n        self._running = True\n        self.runningChanged.emit()\n        thread.start()\n",
                  ),
              ],
              "src/qf_platform/desktop/ui5_controller.py": [
                  (
                      "        self._worker = worker\n        self._thread = thread\n        self.runningChanged.emit()\n",
                      "        self._worker = worker\n        self._thread = thread\n        self._running = True\n        self.runningChanged.emit()\n",
                  ),
                  (
                      "    def _validation_worker_finished(self) -> None:\n        self._worker = None\n        self._thread = None\n        self.runningChanged.emit()\n",
                      "    def _validation_worker_finished(self) -> None:\n        # Keep the just-finished PySide wrappers alive outside QThread.finished.\n        # Releasing them in this callback can race Qt deferred QObject destruction.\n        self._running = False\n        self.runningChanged.emit()\n",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected one match, found {count}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
      - name: Commit lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qf_platform/desktop/ui2_controller.py src/qf_platform/desktop/ui3_controller.py src/qf_platform/desktop/ui4_controller.py src/qf_platform/desktop/ui5_controller.py
          git commit -m "UI5: stabilize Qt worker wrapper lifetime"
          git push origin HEAD:ui5/43-validation-model-risk-hardening
